name: Automated tests

on:
  push:
  pull_request:

jobs:
  # 1) pytest-django unit + integration tests, AI-generated tests and the agent's own tests
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt
      - name: Check migrations
        run: python manage.py migrate --noinput
      - name: Run unit, integration and AI-generated tests with coverage
        run: pytest --cov=events --cov=orders --cov=tickets_addons --cov-report=term-missing --cov-report=html --cov-report=xml
      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v4
        with:
          name: html-coverage
          path: htmlcov/

  # 2) hand-written browser tests (pytest-playwright)
  e2e-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt
      - run: playwright install --with-deps chromium
      - name: Run pytest-playwright E2E tests
        run: pytest -m e2e --browser chromium

  # 3) tests written and maintained by the Playwright Test Agents
  e2e-agents:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e-agents
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip && pip install -r ../requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Run agent-generated Playwright tests
        run: npx playwright test
        env:
          PYTHON: python
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-agents-report
          path: e2e-agents/playwright-report/

  # 4) short Locust load test (fails if any request fails)
  load-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt
      - name: Start Django with demo data
        run: |
          python e2e-agents/start_server.py > server.log 2>&1 &
          for i in $(seq 60); do curl -sf -o /dev/null http://127.0.0.1:8001/ && break; sleep 1; done
      - name: Run Locust headless for 30 seconds
        run: locust -f locustfile.py --headless -u 20 -r 5 -t 30s --host http://127.0.0.1:8001 --csv locust --html locust-report.html
      - name: Upload Locust results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: locust-results
          path: |
            locust*.csv
            locust-report.html
