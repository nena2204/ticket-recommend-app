name: AI test generation agent

# Started manually (Actions tab -> "AI test generation agent" -> Run workflow).
# With the default provider "github" it uses GitHub Models through the built-in
# GITHUB_TOKEN, so no secret is needed. For "anthropic" add the ANTHROPIC_API_KEY secret.
# The generated tests are NOT committed automatically: download the artifact,
# review the tests, then commit them yourself.
on:
  workflow_dispatch:
    inputs:
      provider:
        description: "LLM provider"
        type: choice
        options: [github, anthropic]
        default: github
      model:
        description: "Model (empty = default of the provider, e.g. openai/gpt-4.1-mini)"
        default: ""
      iterations:
        description: "Maximum number of test files to generate"
        default: "5"
      target:
        description: "Optional file to target, for example events/views_profile.py"
        default: ""

permissions:
  contents: read
  models: read   # lets GITHUB_TOKEN call GitHub Models

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt
      - run: python manage.py migrate --noinput
      - name: Run the agent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PROVIDER: ${{ inputs.provider }}
          MODEL: ${{ inputs.model }}
          ITERATIONS: ${{ inputs.iterations }}
          TARGET: ${{ inputs.target }}
        run: |
          ARGS="--provider $PROVIDER --iterations $ITERATIONS"
          if [ -n "$MODEL" ]; then ARGS="$ARGS --model $MODEL"; fi
          if [ -n "$TARGET" ]; then ARGS="$ARGS --target $TARGET"; fi
          python -m ai_testgen $ARGS
      - name: Show the report in the job summary
        if: always()
        run: cat ai_testgen/runs/*/report.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-testgen-results
          path: |
            ai_testgen/runs/
            tests/ai_generated/
